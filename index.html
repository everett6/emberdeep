<script>

let roomWhy='';
async function getRoom(){
  if(room)return room;
  for(let i=0;i<25;i++){
    try{
      if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){
        const r=await claude.use('room');
        if(r){room=r;roomWhy='';return r}
        roomWhy='The room feature was not granted to this view. Open the artifact from its claude.ai link while signed in (not a preview or download).';
        if(i>=3)return null;
      }else roomWhy='Not running inside the Claude artifact viewer (no claude runtime found).';
    }catch(e){roomWhy='Room error: '+(e&&e.message||e)}
    await new Promise(r=>setTimeout(r,400));
  }
  return null;
}
getRoom();
let clearInfo=null,state='title',t=0,time=0,shake=0,freeze=0,deaths=0,shards=0,level=1,clearT=0,bonus=0,lastBoss='',bossDefeated=false;
const hash=(a,b)=>{let h=(a*374761393+b*668265263)>>>0;h=((h^(h>>>13))*1274126177)>>>0;return (h^(h>>>16))>>>0};
function mkRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let x=Math.imul(a^(a>>>15),1|a);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296}}

// ---------- save ----------
const SAVE_KEY='emberdeep-save-v1';
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.level>=1)return s}catch(e){}return null}

if(meta.gold===undefined)meta.gold=60;meta.gold=meta.gold|0;meta.chOwn=Array.isArray(meta.chOwn)?meta.chOwn:[0];if(!meta.chOwn.includes(0))meta.chOwn.push(0);
meta.ach=meta.ach||{};meta.tech=meta.tech||{};meta.st=Object.assign({kills:0,bosses:0,best:0,maxLv:0,flawless:0},meta.st||{});meta.c1=meta.c1|0;meta.c2=meta.c2|0;
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch(e){}}
const TECHS=[
 {id:'wall',n:'Wall Kick',hint:'Walls are not always walls...',how:'Hold toward a wall in the air to slide, press Jump to kick off it.'},
 {id:'hyper',n:'Hyper Jump',hint:'Momentum is a gift. Do not waste a dash.',how:'Jump during a dash or spear lunge to keep the speed in the air.'},
 {id:'cancel',n:'Cancel',hint:'A landed hit is a promise you can break.',how:'Dash right after an attack connects: it cancels the recovery and resets your attack.'},
 {id:'parry',n:'Perfect Parry',hint:'Swing first, bleed never.',how:'Start an attack just before you would be hit: no damage, big stun, charge for Time Stop.'},

function checkAch(){ACH.forEach(a=>{if(!meta.ach[a.id]&&a.ok()){meta.ach[a.id]=1;meta.gold+=a.g;goldWon+=a.g;say('ACHIEVEMENT: '+a.n+'   +'+a.g+' gold',220);sfx.rest()}})}
let saved=loadSave();

// ---------- audio ----------
let ac=null,master=null,mute=false;
function initAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume()}catch(e){}}
let musT=0,musStep=0;
const ROOTS=[110,98,117,104,123,92,104,87,130,98],CHORD=[0,0,-4,-2,0,3,-4,-5],ARP=[0,7,12,15,12,7,3,7];
function tone(f,t0,d,type,v){try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(master);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
function musicTick(){
  if(!ac||mute||ac.state!=='running'||!master)return;
  if(!(state==='play'||state==='title'||state==='pause'||state==='clear'))return;
  const now=ac.currentTime;if(musT<now)musT=now+.05;
  const bossOn=state==='play'&&typeof boss!=='undefined'&&boss&&!boss.dying,calm=state!=='play';
  const sd=pvp&&state==='play'?.14:bossOn?.15:calm?.3:.23;
  const root=ROOTS[(typeof level!=='undefined'?level-1:0)%ROOTS.length]*(pvp?1.2:1);
  while(musT<now+.35){
    const bar=Math.floor(musStep/8)%CHORD.length,ch=CHORD[bar],i=musStep%8,sm=n=>Math.pow(2,n/12);
    if(i%4===0)tone(root*sm(ch)/2,musT,sd*3.6,'sine',.05);
    if(bossOn&&i%2===0)tone(root*sm(ch)/4,musT,sd*.8,'sawtooth',.018);
    tone(root*2*sm(ch+ARP[i]),musT,sd*1.6,'triangle',calm?.012:.02);
    if(bossOn&&i%4===2)tone(root*4*sm(ch+ARP[(i+3)%8]),musT,sd,'square',.006);
    musT+=sd;musStep++;
  }
}
function beep(f,d,type='square',v=.04,slide=0){
  if(!ac||mute)return;try{
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g).connect(master||ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}
const sfx={
  slash:()=>beep(520,.09,'sawtooth',.035,-300),
  hit:()=>beep(200,.1,'square',.05,-100),
  jump:()=>beep(300,.1,'triangle',.04,250),
  dash:()=>beep(700,.12,'sawtooth',.03,-450),
  hurt:()=>beep(130,.4,'sawtooth',.08,-80),
  gem:()=>{beep(900,.07,'triangle',.04);setTimeout(()=>beep(1300,.1,'triangle',.04),60)},
  rest:()=>{beep(440,.2,'sine',.05);setTimeout(()=>beep(660,.3,'sine',.05),150)},
  slam:()=>beep(90,.4,'sawtooth',.1,-40),
  boom:()=>beep(150,.5,'sawtooth',.08,-110),
  parry:()=>{beep(1200,.1,'square',.05,-300);setTimeout(()=>beep(1800,.15,'triangle',.05,-600),40)},
  sup:()=>{beep(220,.5,'sawtooth',.06,660);setTimeout(()=>beep(880,.4,'triangle',.05,-500),150)},
  chest:()=>{[600,800,1000,1400].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.05),i*70))},
  whip:()=>beep(900,.08,'sawtooth',.03,-700),
  stab:()=>beep(1100,.05,'square',.03,-500),
  crit:()=>{beep(1500,.08,'square',.05,-400);setTimeout(()=>beep(600,.1,'sawtooth',.05),40)}
};

// ---------- themes, bosses ----------
const THEMES=[
 {name:'Mossy Depths',top:'#040712',bot:'#0d1c2e',tiles:['#18233a','#1b2742','#16203a','#1e2a45'],moss:'#2f8a7a',mossHi:'#4fd1a5',p1:'#08101f',p2:'#0c1830',spore:'140,255,230',fog:'60,120,160'},
 {name:'Spore Gardens',top:'#07100a',bot:'#12281c',tiles:['#1b2e22','#20352a','#192a20','#243b2e'],moss:'#6aa83a',mossHi:'#b6f060',p1:'#0a1a10',p2:'#10261a',spore:'200,255,140',fog:'90,160,80'},
 {name:'Crimson Quarry',top:'#12060a',bot:'#2a0f14',tiles:['#3a1a22','#43202a','#341820','#4a2630'],moss:'#a8452f',mossHi:'#ff8a5a',p1:'#1c0a10',p2:'#2a1018',spore:'255,170,120',fog:'160,60,50'},
 {name:'Frostveil Caverns',top:'#060c18',bot:'#14283e',tiles:['#26405c','#2c4a68','#223a54','#32526f'],moss:'#8fd0e8',mossHi:'#e6fbff',p1:'#0a1626',p2:'#102238',spore:'210,240,255',fog:'120,180,220'},
 {name:'Gilded Ruins',top:'#120d05',bot:'#2c200c',tiles:['#4a3a1c','#54421f','#413317','#5c4a26'],moss:'#b08a2a',mossHi:'#ffd45a',p1:'#1c1408',p2:'#2a1e0c',spore:'255,220,120',fog:'160,130,60'},
 {name:'Void Orchard',top:'#0a0614',bot:'#1e1034',tiles:['#2c2048','#33265a','#281c42','#3a2c64'],moss:'#a050c8',mossHi:'#f08aff',p1:'#120a22',p2:'#1a1030',spore:'230,160,255',fog:'130,80,180'}
,
 {name:'Ember Foundry',top:'#100604',bot:'#2c120a',tiles:['#3a2016','#44261a','#321c12','#4c2c1e'],moss:'#b8561a',mossHi:'#ffb050',p1:'#1a0c06',p2:'#2a140a',spore:'255,160,80',fog:'170,70,30'},
 {name:'Tidal Grotto',top:'#030c12',bot:'#0a2a34',tiles:['#15414a','#1a4c56','#123a44','#205862'],moss:'#2aa0a8',mossHi:'#7af0e0',p1:'#06161c',p2:'#0a2430',spore:'140,255,240',fog:'40,150,160'},
 {name:'Bone Catacombs',top:'#0e0c0a',bot:'#241f1a',tiles:['#4a4238','#524a3e','#403830','#5a5144'],moss:'#a89a7a',mossHi:'#efe2c0',p1:'#16120e',p2:'#221c16',spore:'230,220,190',fog:'140,130,110'},
 {name:'Neon Hollow',top:'#05020e',bot:'#14062a',tiles:['#241448','#2c1858','#201040','#341c66'],moss:'#e040c0',mossHi:'#40f0ff',p1:'#0c0418',p2:'#16082c',spore:'100,240,255',fog:'160,60,200'}
];
const theme=()=>THEMES[(level-1)%THEMES.length];
const BOSSES=['moth','colossus','matron','stalker','harpy','wyrm','warden','archon','reaper','queen'];
const BOSSDEF={
  moth:{hp:20,w:76,h:64,name:'THE CINDER MOTH'},
  colossus:{hp:30,w:92,h:92,name:'THE QUARRY COLOSSUS'},
  matron:{hp:24,w:72,h:72,name:'THE SPORE MATRON'},
  stalker:{hp:22,w:40,h:58,name:'THE GLASS STALKER'},
  harpy:{hp:22,w:70,h:50,name:'THE GALE HARPY'},
  wyrm:{hp:28,w:64,h:84,name:'THE DEEP WYRM'},
  warden:{hp:36,w:62,h:84,name:'THE IRON WARDEN'},
  archon:{hp:26,w:60,h:70,name:'THE STORM ARCHON'},
  reaper:{hp:30,w:56,h:76,name:'THE PALE REAPER'},
  queen:{hp:32,w:84,h:62,name:'THE HIVE QUEEN'}
};
const TRADERS=['Pip the Peddler','Dottie the Dealer','Mossy Bram','Wren the Wanderer','Old Tobbin','Fenna Fungus','Nib the Nomad','Quill the Collector'];

// ---------- level grid ----------
let grid=new Uint8Array(COLS*ROWS),seen=new Uint8Array(COLS*ROWS),seenKey=-1;
const rect=(x,y,w,h,v=1)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&i<COLS&&j>=0&&j<ROWS)grid[j*COLS+i]=v};
const solid=(tx,ty)=>{if(tx<0||tx>=COLS||ty<0)return true;if(ty>=ROWS)return false;return grid[ty*COLS+tx]===1};
let ARENA_L=(GX+1)*T+10,ARENA_R=(COLS-1)*T-10;
function setCols(n){COLS=n;GX=n-28;grid=new Uint8Array(n*ROWS);seen=new Uint8Array(n*ROWS);seenKey=-1;ARENA_L=(GX+1)*T+10;ARENA_R=(COLS-1)*T-10}
const colsFor=l=>200+Math.min(260,(l-1)*16);

// ---------- entities ----------
let p,enemies=[],gems=[],cps=[],boss=null,waves=[],parts=[],spores,cam,toast,gateClosed=false,pv;
let rmode='',seedOff=0,lives=3,rushN=0,runStash=null,runGold=0,pvpArena=0,pvpHz=[],dateNum=0;
let traders=[],owned=new Set(),equipped=new Set(),menu=null,texts=[],drains=[],gusts=[],chaks=[],chests=[],P=[],coop=false,pvp=false,pvpWins=[0,0],pvpKO=0,pvpW=-1,upSave=null,eqSave=null,PXY=[],chr=meta.c1,chr2=meta.c2||1,combo=0,comboT=0,bestCombo=0,lvKills=0,lvHits=0,lvTime=0,goldWon=0,tstop=0,tsMax=1,achQ=[],up={forge:0,wind:0,dens:0,fire:0,spear:0,sky:0,dag:0,whip:0,chak:0,bow:0,scy:0,rod:0};
spores=Array.from({length:55},()=>({x:Math.random()*VW,y:Math.random()*VH,vx:(Math.random()-.5)*.3,vy:-Math.random()*.25-.05,ph:Math.random()*6}));
cam={x:0,y:0};toast={s:'',t:0};pv={jump:false,atk:false,dash:false,sp:false,spear:false};

function newPlayer(x,y,ci,idx){return {idx:idx|0,chr:ci|0,wep:0,dead:0,sup:0,supCd:0,hyper:0,parry:0,pogo:0,pv:{jump:true,atk:true,dash:true,sp:true,spear:true,su:true},name0:idx?'P2 ':'',x,y,w:18,h:28,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,dash:0,dashCd:0,atk:0,atkCd:0,atkDir:'f',hit:new Set(),inv:0,stun:0,hp:6,max:6,cp:cps[0],ember:0,airJumps:1,burst:0,mace:0,maceCd:0,spT:0,spC:0,spWin:0,spCd:0,spMax:12,spHit:new Set(),sky:0,slam:false,wpn:'s',atkMax:11,dashHit:new Set(),trail:[],run:0,sq:0,wasOn:false}}
function resetPV(){P.forEach(q=>q.pv={jump:true,atk:true,dash:true,sp:true,spear:true,su:true})}
function say(s,n=150){toast={s,t:n}}

function loadLevel(){
  GEN++;
  const R=mkRng(level*7919+13+seedOff),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  setCols(colsFor(level));const SC=GX/172;
  grid.fill(0);
  rect(0,0,COLS,2);rect(0,G,COLS,ROWS-G);rect(GX+1,2,COLS-GX-1,G-AH-2);rect(0,0,1,ROWS);rect(COLS-1,0,1,ROWS);
  gateClosed=false;boss=null;waves=[];bossDefeated=false;parts=[];texts=[];drains=[];gusts=[];chaks=[];chests=[];
  const ncp=Math.max(4,Math.round(GX/48)),cpCols=[6];for(let i=1;i<ncp-1;i++)cpCols.push(Math.round(6+(GX-16)*i/(ncp-1)));cpCols.push(GX-10);
  const trCols=[ri(20,Math.round(GX*.25)),ri(Math.round(GX*.6),Math.round(GX*.75))];
  const reserved=[...cpCols,...trCols];
  const free=(a,b)=>reserved.every(c=>b<c-4||a>c+4)&&a>=10&&b<=GX-6;
  // pits
  const pits=[],np=Math.round(Math.min(3+Math.floor(level/2),7)*SC);let tries=0;
  while(pits.length<np&&tries++<300){
    const w=(level>=5&&R()<.4)?5:3,x=ri(12,GX-8-w);
    if(!free(x-1,x+w))continue;
    if(pits.some(([px,pw])=>x<px+pw+9&&x+w>px-9))continue;
    pits.push([x,w]);
  }
  pits.forEach(([x,w])=>{rect(x,G,w,ROWS-G,0);if(w===5)rect(x+2,G-2,2,1)});
  // platforms
  const plats=[],npl=Math.round(ri(20,26)*SC);tries=0;
  while(plats.length<npl&&tries++<400){
    const w=ri(3,4),x=ri(8,GX-6-w),y=ri(G-9,G-3);
    if(plats.some(([px,py,pw])=>Math.abs(py-y)<2&&x<px+pw+3&&x+w>px-3))continue;
    if(pits.some(([qx,qw])=>qw===5&&x<qx+qw+1&&x+w>qx-1))continue;
    plats.push([x,y,w]);rect(x,y,w,1);
  }
  // low steps
  const steps=[],ns=Math.round(ri(7,11)*SC);tries=0;
  while(steps.length<ns&&tries++<300){
    const w=ri(2,3),x=ri(12,GX-8-w);
    if(!free(x-1,x+w))continue;
    if(pits.some(([px,pw])=>x<px+pw+2&&x+w>px-2))continue;
    if(steps.some(([sx,sw])=>x<sx+sw+3&&x+w>sx-3))continue;
    steps.push([x,w]);rect(x,G-1,w,1);
  }
  const ledges=[],towers=[],nTw=Math.round((3+Math.min(5,Math.floor(level/2)))*SC);tries=0;
  while(towers.length<nTw&&tries++<200){
    const x=ri(14,GX-22);
    if(!free(x-1,x+15)||towers.some(tx=>Math.abs(tx-x)<18))continue;
    if(pits.some(([px,pw])=>x<px+pw+2&&x+15>px-2))continue;
    towers.push(x);
    {const lx=x+11,ly=G-16;rect(lx,ly,4,1);plats.push([lx,ly,4]);ledges.push([lx,ly])}
    [G-3,G-6,G-9,G-12].forEach((y,i)=>{const px=x+(i%2?4:0)+i*2;rect(px,y,3,1);plats.push([px,y,3])});
  }
  cps=cpCols.map(c=>({x:c*T,lit:false}));
  // traders
  const ids=Object.keys(CHARMS);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  traders=[{x:trCols[0]*T+2,name:TRADERS[(level*2)%TRADERS.length],stock:['forge','spear','wind','dag','whip','bow',...ids.slice(0,2)]},
           {x:trCols[1]*T+2,name:TRADERS[(level*2+1)%TRADERS.length],stock:['dens','fire','sky','chak','scy','rod',...ids.slice(4,6)]}];
  // enemies
  enemies=[];
  const near=(c)=>reserved.some(r=>Math.abs(r-c)<6);
  const okG=c=>solid(c,G)&&solid(c-1,G)&&solid(c+1,G)&&!solid(c,G-1)&&!solid(c-1,G-1)&&!solid(c+1,G-1);
  const nc=Math.round(Math.min(12+Math.round(level*1.6),40)*SC),nf=Math.round(Math.min(7+Math.round(level*1.5),28)*SC);
  const hm=mobMult()*(1+.09*(level-1))*1.5,chp=Math.round((level>=3?6:5)*hm),fhp=Math.round((level>=5?5:4)*hm),cspd=Math.min(2.7,1.15+.07*level),eliteP=level>=6?Math.min(.4,.06*(level-5)):0;
  tries=0;let placed=0;
  while(placed<nc&&tries++<400){
    const c=ri(10,GX-4);
    if(near(c)||!okG(c)||enemies.some(e=>Math.abs(e.x/T-c)<2))continue;
    {const el=R()<eliteP;enemies.push({type:'c',x:c*T+3,y:G*T-18,w:26,h:18,vx:0,vy:0,dir:R()<.5?1:-1,hp:el?Math.round(chp*2.2):chp,flash:0,onGround:false,spd:el?cspd*1.25:cspd,elite:el});placed++}

let lastTs=0,acc=0,alpha=1,pcam={x:0,y:0};
const STEP=1000/60;
function snap(){
  P.forEach(q=>{q.px=q.x;q.py=q.y});enemies.forEach(e=>{e.px=e.x;e.py=e.y});if(boss){boss.px=boss.x;boss.py=boss.y}
  chaks.forEach(c=>{c.px=c.x;c.py=c.y});waves.forEach(w=>{w.px=w.x;w.py=w.y});pcam.x=cam.x;pcam.y=cam.y;
}
function loop(ts){
  if(ts===undefined){snap();update();alpha=1}
  else{
    if(!lastTs)lastTs=ts;
    acc+=Math.min(100,ts-lastTs);lastTs=ts;
    let n=0;while(acc>=STEP-.5&&n<4){snap();update();acc-=STEP;n++}
    if(n===4)acc=0;if(acc<0)acc=0;alpha=Math.min(1,acc/STEP);
  }
  draw();musicTick();requestAnimationFrame(loop)}
loop();
// Link-based start: ?room=ABCD&role=host|guest[&mode=versus] skips the lobby so each player just opens their link.
(()=>{const q=new URLSearchParams(location.search),code=(q.get('room')||'').toUpperCase(),role=q.get('role');
  if(!/^[A-Z]{4}$/.test(code)||(role!=='host'&&role!=='guest'))return;
  openLobby();lobby.fixed=code;lobby.auto=true;lobby.versus=q.get('mode')==='versus';
  if(role==='host')hostStart();else{lobby.code=code;joinStart()}})();
})();
</script>
